<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#011710" />
    </linearGradient>

    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Gold Inner Glow -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- App Icon Rounded Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#centerGlow)" />

  <!-- Gold Border Frame -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.85" />
  <rect x="34" y="34" width="444" height="444" rx="90" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.3" />

  <!-- Main Islamic Arch & Emblem Group -->
  <g filter="url(#shadow)">
    <!-- Islamic Dome / Arch Frame Silhouette -->
    <path d="M 256 95 
             C 290 135, 350 160, 360 210 
             V 340 
             H 152 
             V 210 
             C 162 160, 222 135, 256 95 Z" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="5" 
          stroke-linejoin="round" />

    <!-- Crescent Moon at Top of Dome -->
    <path d="M 256 68 
             A 18 18 0 1 0 274 86 
             A 14 14 0 1 1 256 68 Z" 
          fill="url(#goldGrad)" 
          filter="url(#glow)" />

    <!-- Crescent Star -->
    <polygon points="268,66 270,71 275,71 271,74 272,79 268,76 264,79 265,74 261,71 266,71" fill="url(#goldGrad)" />

    <!-- Open Book (Al-Qur'an / Kitab) Emblem -->
    <g transform="translate(0, 10)">
      <!-- Left Page -->
      <path d="M 256 280 Q 210 260 165 270 L 165 330 Q 210 320 256 340 Z" 
            fill="url(#goldLight)" 
            stroke="url(#goldGrad)" 
            stroke-width="3" />
      <!-- Right Page -->
      <path d="M 256 280 Q 302 260 347 270 L 347 330 Q 302 320 256 340 Z" 
            fill="url(#goldLight)" 
            stroke="url(#goldGrad)" 
            stroke-width="3" />
      <!-- Book Spine Center -->
      <path d="M 256 276 L 256 344" stroke="#78350f" stroke-width="4" stroke-linecap="round" />
      
      <!-- Book Lines (Left) -->
      <line x1="185" y1="285" x2="240" y2="295" stroke="#78350f" stroke-width="2" stroke-linecap="round" opacity="0.6" />
      <line x1="185" y1="300" x2="240" y2="310" stroke="#78350f" stroke-width="2" stroke-linecap="round" opacity="0.6" />
      <!-- Book Lines (Right) -->
      <line x1="272" y1="295" x2="327" y2="285" stroke="#78350f" stroke-width="2" stroke-linecap="round" opacity="0.6" />
      <line x1="272" y1="310" x2="327" y2="300" stroke="#78350f" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    </g>

    <!-- Geometric Calligraphic Star above Book -->
    <g transform="translate(256, 205)">
      <!-- Octagram / Rub el Hizb -->
      <rect x="-24" y="-24" width="48" height="48" fill="url(#goldGrad)" transform="rotate(0)" rx="4" />
      <rect x="-24" y="-24" width="48" height="48" fill="url(#goldGrad)" transform="rotate(45)" rx="4" />
      <circle cx="0" cy="0" r="14" fill="#022c22" />
      <circle cx="0" cy="0" r="6" fill="url(#goldGrad)" />
    </g>
  </g>

  <!-- App Title Banner Typography -->
  <text x="256" y="415" 
        text-anchor="middle" 
        font-family="'Playfair Display', 'Georgia', serif" 
        font-size="42" 
        font-weight="900" 
        letter-spacing="6" 
        fill="url(#goldGrad)" 
        filter="url(#glow)">
    SATDAF
  </text>
  <text x="256" y="440" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" 
        font-size="14" 
        font-weight="700" 
        letter-spacing="3" 
        fill="#a7f3d0" 
        opacity="0.9">
    DARUL ARIFIN JAMBI
  </text>
</svg>
