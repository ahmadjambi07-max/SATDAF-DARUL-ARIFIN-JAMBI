# Production stack for a VPS: the SATDAF app + Caddy (automatic HTTPS).
# Usage: docker compose -f docker-compose.prod.yml up -d --build
# Variables come from .env next to this file (DOMAIN, GEMINI_API_KEY).

services:
  app:
    build:
      context: .
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - APP_URL=${APP_URL:-}
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      - "DOMAIN=${DOMAIN:?Set DOMAIN in .env, contoh DOMAIN=satdaf.id}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
